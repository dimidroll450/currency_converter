<form [formGroup]="currencyForm" (ngSubmit)="convertValue()">
  <fieldset>
    <legend>Міняю</legend>
    <mat-form-field>
      <mat-label>Введіть сумму</mat-label>
      <input matInput inputmode="decimal" formControlName="inputValue">
    </mat-form-field>
    <mat-form-field>
      <mat-select formControlName="inputCurrency">
        <mat-option value="" />
        @for (cur of list(); track cur.r030) {
          <mat-option [value]="cur.cc">{{ cur.txt }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </fieldset>

  <fieldset>
    <legend>Отримую</legend>
    <mat-form-field>
      <mat-label>Результат</mat-label>
      <input class="valOutput" matInput formControlName="outputValue">
    </mat-form-field>
    <mat-form-field>
      <mat-select formControlName="outputCurrency">
        <mat-option value="UAH">Гривня</mat-option>
      </mat-select>
    </mat-form-field>
  </fieldset>

  <button type="submit" mat-fab extended color="primary">Розрахувати</button>
</form>
