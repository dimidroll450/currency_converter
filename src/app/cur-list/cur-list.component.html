<mat-card>
  <mat-card-header>
    <mat-card-title>Актуальний курс валют проти Гривні</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <div class="container">
      @for (cur of list(); track cur.r030) {
        <div class="item">
          <p class="cur-name">{{ cur.txt | uppercase }}</p>
          <p class="cur-value"><strong><em>{{ cur.rate }}</em></strong></p>
        </div>
      } @empty {
        <p>Виникла помилка під час завантаження списку валют</p>
      }
    </div>
  </mat-card-content>
</mat-card>
